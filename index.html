<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#cfe3f2">
  <!-- "Add to Home Screen" opens full screen like an app (iPhone + Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Polar Camp">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Polar Camp</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- All visible texts come from src/locales/<lang>.json (data-i18n keys); the English here is only what shows while loading. -->
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="labels"></div>

    <div id="hud">
      <div class="pill" id="cash-pill"><span class="ico">💵</span><span id="cash">0</span></div>
      <div class="pill small" id="bag-pill"><span class="ico">🎒</span><span id="bag">0/12</span></div>
    </div>

    <div id="wave">
      <div id="wave-title"></div>
      <div id="wave-bar"><div id="wave-fill"></div></div>
      <div id="boss" class="hidden">
        <div id="boss-name"></div>
        <div id="boss-bar"><div id="boss-fill"></div></div>
      </div>
    </div>

    <div id="poison" class="hidden"></div>

    <button id="help-btn" aria-label="How to play" data-i18n-aria="aria.help">?</button>
    <button id="sound-btn" aria-label="Sound on/off" data-i18n-aria="aria.sound">🔊</button>
    <button id="options-btn" aria-label="Options" data-i18n-aria="aria.options">⚙️</button>

    <div id="hint" class="hidden"><span id="hint-ico"></span><span id="hint-text"></span></div>

    <div id="armor-bar" class="hidden"><div id="armor-fill"></div></div>
    <div id="hp"><div id="hp-fill"></div></div>

    <div id="banner"></div>

    <div id="joy-base"><div id="joy-knob"></div></div>

    <div id="defeat" class="hidden">
      <div class="defeat-card">
        <div class="defeat-title" data-i18n="defeat.title">DEFEAT</div>
        <div class="defeat-sub" data-i18n="defeat.sub">The bears got you.</div>
        <button id="retry" data-i18n="defeat.retry">TRY AGAIN</button>
      </div>
    </div>

    <div id="title-screen">
      <button id="lang-link" class="link"><span id="lang-link-flag" class="flag"></span><span id="lang-link-name">English</span></button>
      <div class="logo">POLAR<br>CAMP</div>
      <div class="tag" data-i18n="title.tag">Build your camp. Survive the bears.</div>
      <div class="loop">
        <div><span>🌲</span><b data-i18n="title.chop">Chop</b></div><i>›</i>
        <div><span>🏗️</span><b data-i18n="title.build">Build</b></div><i>›</i>
        <div><span>🐻</span><b data-i18n="title.fight">Fight</b></div><i>›</i>
        <div><span>💵</span><b data-i18n="title.sell">Sell</b></div>
      </div>
      <button id="play" data-i18n="title.play">PLAY</button>
      <button id="how" class="secondary" data-i18n="title.how">HOW TO PLAY</button>
      <button id="new-game" class="link hidden" data-i18n="title.newGame">Start a new game</button>
      <div class="hint" data-i18n="title.hint">Drag anywhere to move · WASD on a computer</div>
    </div>

    <!-- first launch only: the signpost language picker (concept A, owner's pick 2026-09-29) -->
    <div id="lang-screen" class="hidden">
      <div class="logo">POLAR<br>CAMP</div>
      <div class="ask" data-i18n="lang.ask">Choose your language</div>
      <div class="post">
        <button class="plank" data-lang="en"><span class="snowcap"></span><span class="nail"></span><span>English</span><span class="code">EN</span></button>
        <button class="plank left" data-lang="fr"><span class="snowcap"></span><span class="code">FR</span><span>Français</span><span class="nail"></span></button>
        <button class="plank" data-lang="es"><span class="snowcap"></span><span class="nail"></span><span>Español</span><span class="code">ES</span></button>
      </div>
      <button id="lang-go" data-i18n="lang.go">CONTINUE</button>
    </div>

    <div id="options" class="hidden" role="dialog" aria-label="Options">
      <div class="opt-card">
        <div class="opt-title" data-i18n="options.title">OPTIONS</div>
        <div class="opt-row"><span data-i18n="options.language">Language</span>
          <div class="seg" id="opt-lang">
            <button data-lang="en"><span class="flag" data-flag="en"></span>EN</button>
            <button data-lang="fr"><span class="flag" data-flag="fr"></span>FR</button>
            <button data-lang="es"><span class="flag" data-flag="es"></span>ES</button>
          </div>
        </div>
        <div class="opt-row"><span data-i18n="options.sound">Sound</span>
          <div class="seg" id="opt-sound">
            <button data-sound="on" data-i18n="options.on">ON</button>
            <button data-sound="off" data-i18n="options.off">OFF</button>
          </div>
        </div>
        <button id="options-close" data-i18n="options.done">DONE</button>
      </div>
    </div>

    <div id="help" class="hidden" role="dialog" aria-label="How to play" data-i18n-aria="aria.help">
      <div class="help-card">
        <div class="help-title" data-i18n="help.title">HOW TO PLAY</div>
        <div class="help-list" id="help-list"><!-- rows built in main.js from the locale --></div>
        <div class="help-tip" data-i18n-html="help.tip"></div>
        <button id="help-close" data-i18n="help.close">GOT IT</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
